server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Client-side routing (react-router): any path that isn't a real static
    # file falls back to index.html so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets are safe to cache aggressively; index.html
    # itself must always be revalidated so a new deploy is picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
