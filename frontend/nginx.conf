server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # The release frontend is built with VITE_API_BASE_URL=/api. Keep that
    # same-origin contract inside the artifact instead of relying on an
    # undocumented external ingress rewrite.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (react-router): any path that isn't a real static
    # file falls back to index.html so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # One-time lifecycle secrets arrive in the query string. Do not write
    # these initial navigation requests to access logs; the SPA immediately
    # replaces the visible URL with its token-free form.
    location = /verify-email {
        access_log off;
        try_files $uri /index.html;
    }

    location = /reset-password {
        access_log off;
        try_files $uri /index.html;
    }

    # Fingerprinted build assets are safe to cache aggressively; index.html
    # itself must always be revalidated so a new deploy is picked up.
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }
}
