name: finance-app-smoke

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_app"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: finance-app-backend:smoke
    build:
      context: ../../backend
    environment:
      APP_ENV: production
      PORT: "8080"
      JWT_SECRET: "ci-only-0123456789abcdef0123456789abcdef"
      STORAGE_PROVIDER: postgres
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finance_app?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: https://ci.example.invalid
      PRICE_PROVIDER: mock
      DEMO_MODE_ENABLED: "true"
      BENCHMARK_AWARD_MODE: demo
      BASE_CURRENCY: USD
      ENABLE_REAL_MARKET_DATA: "false"
      ENABLE_BACKGROUND_WORKERS: "true"
      ENABLE_QUOTE_REFRESH_WORKER: "true"
      PASSWORD_REGISTRATION_ENABLED: "false"
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 45

  frontend:
    image: finance-app-frontend:smoke
    build:
      context: ../../frontend
      target: production
      args:
        VITE_API_BASE_URL: http://127.0.0.1:18080
    ports:
      - "18081:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30
